name: Compile

on:
  push:
    paths: ["**.java", ".github/**", "ci/**"]
  pull_request:
    paths: ["**.java", ".github/**", "ci/**"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile every Java file
        run: bash ci/compile.sh
